name: build
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.7" }
      - name: Create project
        run: |
          mkdir -p app/src/main/java/app/fastview
          cat > settings.gradle.kts << 'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "FastView"
          include(":app")
          EOF_FILE
          cat > build.gradle.kts << 'EOF_FILE'
          plugins {
              id("com.android.application") version "8.5.2" apply false
              id("org.jetbrains.kotlin.android") version "1.9.24" apply false
          }
          EOF_FILE
          cat > gradle.properties << 'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          EOF_FILE
          cat > app/build.gradle.kts << 'EOF_FILE'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android") }
          android {
              namespace = "app.fastview"
              compileSdk = 34
              defaultConfig { applicationId = "app.fastview"; minSdk = 29; targetSdk = 34; versionCode = 1; versionName = "1.0" }
              buildTypes {
                  release {
                      isMinifyEnabled = true
                      proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"))
                      signingConfig = signingConfigs.getByName("debug")
                  }
              }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          EOF_FILE
          cat > app/src/main/AndroidManifest.xml << 'EOF_FILE'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <application android:label="FastView" android:theme="@android:style/Theme.DeviceDefault.DayNight">
                  <activity android:name=".MainActivity" android:exported="true"
                      android:configChanges="orientation|screenSize|keyboardHidden">
                      <intent-filter>
                          <action android:name="android.intent.action.MAIN"/>
                          <category android:name="android.intent.category.LAUNCHER"/>
                      </intent-filter>
                      <intent-filter>
                          <action android:name="android.intent.action.VIEW"/>
                          <category android:name="android.intent.category.DEFAULT"/>
                          <data android:scheme="content"/>
                          <data android:scheme="file"/>
                          <data android:mimeType="*/*"/>
                      </intent-filter>
                  </activity>
              </application>
          </manifest>
          EOF_FILE
          cat > app/src/main/java/app/fastview/Office.kt << 'EOF_FILE'
          package app.fastview

          import org.xmlpull.v1.XmlPullParser
          import org.xmlpull.v1.XmlPullParserFactory
          import java.io.InputStream
          import java.util.TreeMap
          import java.util.zip.ZipInputStream

          object Office {
              private fun parser(b: ByteArray): XmlPullParser =
                  XmlPullParserFactory.newInstance().newPullParser().also { it.setInput(b.inputStream(), null) }

              private fun local(n: String?) = n?.substringAfter(':') ?: ""

              private fun zip(ins: InputStream, want: (String) -> Boolean): Map<String, ByteArray> {
                  val m = TreeMap<String, ByteArray>(compareBy<String>({ it.length }, { it }))
                  ZipInputStream(ins).use { z ->
                      var e = z.nextEntry
                      while (e != null) {
                          if (want(e.name)) m[e.name] = z.readBytes()
                          e = z.nextEntry
                      }
                  }
                  return m
              }

              private fun words(b: ByteArray): String {
                  val x = parser(b)
                  val sb = StringBuilder()
                  var ev = x.eventType
                  while (ev != XmlPullParser.END_DOCUMENT) {
                      val n = local(x.name)
                      if (ev == XmlPullParser.START_TAG) {
                          when (n) {
                              "t" -> sb.append(x.nextText())
                              "tab" -> sb.append('\t')
                              "br" -> sb.append('\n')
                          }
                      } else if (ev == XmlPullParser.END_TAG) {
                          when (n) {
                              "p", "tr" -> sb.append('\n')
                              "tc" -> sb.append('\t')
                          }
                      }
                      ev = x.next()
                  }
                  return sb.toString()
              }

              fun docx(ins: InputStream): String {
                  val d = zip(ins) { it == "word/document.xml" }["word/document.xml"] ?: return "Not a valid docx"
                  return words(d)
              }

              fun pptx(ins: InputStream): String {
                  val z = zip(ins) { it.startsWith("ppt/slides/slide") && it.endsWith(".xml") }
                  val sb = StringBuilder()
                  var k = 0
                  for ((_, b) in z) sb.append("---- Slide ").append(++k).append(" ----\n").append(words(b)).append('\n')
                  return sb.toString()
              }

              private fun colIdx(ref: String): Int =
                  ref.takeWhile { it.isLetter() }.fold(0) { a, c -> a * 26 + (c.uppercaseChar() - 'A' + 1) } - 1

              fun xlsx(ins: InputStream): String {
                  val z = zip(ins) { it == "xl/sharedStrings.xml" || (it.startsWith("xl/worksheets/") && it.endsWith(".xml")) }
                  val ss = ArrayList<String>()
                  z["xl/sharedStrings.xml"]?.let { b ->
                      val x = parser(b)
                      val cur = StringBuilder()
                      var ev = x.eventType
                      while (ev != XmlPullParser.END_DOCUMENT) {
                          if (ev == XmlPullParser.START_TAG && local(x.name) == "t") cur.append(x.nextText())
                          else if (ev == XmlPullParser.END_TAG && local(x.name) == "si") { ss.add(cur.toString()); cur.setLength(0) }
                          ev = x.next()
                      }
                  }
                  val sb = StringBuilder()
                  var k = 0
                  for ((name, b) in z) {
                      if (!name.startsWith("xl/worksheets/")) continue
                      sb.append("# Sheet ").append(++k).append('\n')
                      val x = parser(b)
                      var cur = 0; var col = 0; var type = ""; var rows = 0
                      var ev = x.eventType
                      while (ev != XmlPullParser.END_DOCUMENT && rows < 20000) {
                          if (ev == XmlPullParser.START_TAG) {
                              when (local(x.name)) {
                                  "c" -> {
                                      type = x.getAttributeValue(null, "t") ?: ""
                                      col = colIdx(x.getAttributeValue(null, "r") ?: "")
                                      while (cur < col) { sb.append('\t'); cur++ }
                                  }
                                  "v" -> {
                                      val v = x.nextText()
                                      sb.append(if (type == "s") ss.getOrElse(v.toIntOrNull() ?: -1) { "" } else v)
                                  }
                                  "t" -> sb.append(x.nextText())
                              }
                          } else if (ev == XmlPullParser.END_TAG) {
                              when (local(x.name)) {
                                  "c" -> { sb.append('\t'); cur = col + 1 }
                                  "row" -> { sb.append('\n'); cur = 0; rows++ }
                              }
                          }
                          ev = x.next()
                      }
                      sb.append('\n')
                  }
                  return sb.toString()
              }
          }
          EOF_FILE
          cat > app/src/main/java/app/fastview/MainActivity.kt << 'EOF_FILE'
          package app.fastview

          import android.app.Activity
          import android.content.Intent
          import android.graphics.Bitmap
          import android.graphics.Color
          import android.graphics.Typeface
          import android.graphics.pdf.PdfRenderer
          import android.net.Uri
          import android.os.Bundle
          import android.provider.OpenableColumns
          import android.util.LruCache
          import android.view.View
          import android.view.ViewGroup
          import android.widget.AbsListView
          import android.widget.BaseAdapter
          import android.widget.ImageView
          import android.widget.ListView
          import android.widget.TextView
          import java.util.concurrent.Executors

          class MainActivity : Activity() {
              private val bg = Executors.newSingleThreadExecutor()
              private lateinit var list: ListView
              private var renderer: PdfRenderer? = null

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  list = ListView(this).apply { divider = null }
                  setContentView(list)
                  val uri = intent?.data
                  if (uri != null) open(uri) else pick()
              }

              private fun pick() = startActivityForResult(
                  Intent(Intent.ACTION_OPEN_DOCUMENT).setType("*/*").addCategory(Intent.CATEGORY_OPENABLE), 1)

              override fun onActivityResult(requestCode: Int, resultCode: Int, data: Intent?) {
                  val u = data?.data
                  if (u != null) open(u) else if (list.adapter == null) finish()
              }

              private fun fileName(u: Uri): String {
                  val n = try {
                      contentResolver.query(u, null, null, null, null)?.use { c ->
                          if (c.moveToFirst()) c.getString(c.getColumnIndexOrThrow(OpenableColumns.DISPLAY_NAME)) else null
                      }
                  } catch (e: Exception) { null }
                  return n ?: (u.lastPathSegment ?: "")
              }

              private fun open(u: Uri) {
                  val n = fileName(u)
                  title = n
                  val ext = n.substringAfterLast('.', "").lowercase()
                  if (ext == "pdf" || contentResolver.getType(u) == "application/pdf") { showPdf(u); return }
                  bg.execute {
                      val t = try { readText(u, ext) } catch (e: Throwable) { "Cannot open: ${e.message}" }
                      runOnUiThread { showText(t, ext == "md" || ext == "markdown") }
                  }
              }

              private fun readText(u: Uri, ext: String): String =
                  contentResolver.openInputStream(u)!!.use {
                      when (ext) {
                          "docx" -> Office.docx(it)
                          "pptx" -> Office.pptx(it)
                          "xlsx" -> Office.xlsx(it)
                          "xls", "doc", "ppt" -> "Legacy binary .$ext is not supported. Re-save as xlsx / docx / pptx."
                          else -> {
                              val b = it.readBytes()
                              String(if (b.size > 20_000_000) b.copyOf(20_000_000) else b, Charsets.UTF_8)
                          }
                      }
                  }

              private fun showText(t: String, md: Boolean) {
                  val lines = t.split('\n')
                  val pad = (8 * resources.displayMetrics.density).toInt()
                  list.adapter = object : BaseAdapter() {
                      override fun getCount() = lines.size
                      override fun getItem(i: Int): Any = lines[i]
                      override fun getItemId(i: Int) = i.toLong()
                      override fun getView(i: Int, v: View?, p: ViewGroup): View {
                          val tv = (v as? TextView) ?: TextView(this@MainActivity).apply { setPadding(pad, 0, pad, 0) }
                          val s = lines[i].trimEnd('\r')
                          if (md && s.startsWith("#")) {
                              tv.text = s.trimStart('#', ' ')
                              tv.typeface = Typeface.DEFAULT_BOLD
                              tv.textSize = 17f
                          } else {
                              tv.text = s
                              tv.typeface = Typeface.MONOSPACE
                              tv.textSize = 12f
                          }
                          return tv
                      }
                  }
              }

              private fun showPdf(u: Uri) {
                  val fd = contentResolver.openFileDescriptor(u, "r") ?: return
                  val r = PdfRenderer(fd)
                  renderer = r
                  val w = resources.displayMetrics.widthPixels
                  val cache = LruCache<Int, Bitmap>(6)
                  list.setBackgroundColor(Color.DKGRAY)
                  list.dividerHeight = 6
                  list.adapter = object : BaseAdapter() {
                      override fun getCount() = r.pageCount
                      override fun getItem(i: Int): Any = i
                      override fun getItemId(i: Int) = i.toLong()
                      override fun getView(i: Int, v: View?, p: ViewGroup): View {
                          val iv = (v as? ImageView) ?: ImageView(this@MainActivity).apply {
                              adjustViewBounds = true
                              scaleType = ImageView.ScaleType.FIT_CENTER
                              layoutParams = AbsListView.LayoutParams(ViewGroup.LayoutParams.MATCH_PARENT, ViewGroup.LayoutParams.WRAP_CONTENT)
                          }
                          iv.tag = i
                          val c = cache.get(i)
                          if (c != null) { iv.setImageBitmap(c); return iv }
                          iv.setImageDrawable(null)
                          iv.minimumHeight = (w * 1.41f).toInt()
                          bg.execute {
                              val bmp = try {
                                  synchronized(r) {
                                      val pg = r.openPage(i)
                                      try {
                                          val b = Bitmap.createBitmap(w, maxOf(1, (w * pg.height.toFloat() / pg.width).toInt()), Bitmap.Config.ARGB_8888)
                                          b.eraseColor(Color.WHITE)
                                          pg.render(b, null, null, PdfRenderer.Page.RENDER_MODE_FOR_DISPLAY)
                                          b
                                      } finally { pg.close() }
                                  }
                              } catch (e: Throwable) { null }
                              if (bmp != null) runOnUiThread {
                                  cache.put(i, bmp)
                                  if (iv.tag == i) iv.setImageBitmap(bmp)
                              }
                          }
                          return iv
                      }
                  }
              }

              override fun onDestroy() {
                  super.onDestroy()
                  bg.shutdownNow()
                  try { renderer?.close() } catch (e: Throwable) {}
              }
          }
          EOF_FILE
      - run: gradle assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: FastView, path: "app/build/outputs/apk/release/*.apk" }
